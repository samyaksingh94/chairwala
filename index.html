<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chairwala</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chairwala">
  <script>
    (function() {
      const svgLines = `
        <line x1="82" y1="28" x2="76" y2="118"/>
        <line x1="96" y1="28" x2="90" y2="118"/>
        <line x1="82" y1="28" x2="96" y2="28"/>
        <line x1="76" y1="118" x2="126" y2="148"/>
        <line x1="90" y1="118" x2="140" y2="148"/>
        <line x1="126" y1="148" x2="118" y2="172"/>
        <line x1="140" y1="148" x2="132" y2="172"/>
        <line x1="126" y1="148" x2="140" y2="148"/>
        <line x1="118" y1="172" x2="60" y2="185"/>
        <line x1="132" y1="172" x2="72" y2="190"/>
        <line x1="118" y1="172" x2="132" y2="172"/>
        <line x1="60" y1="185" x2="72" y2="190"/>`;

      // SVG favicon (desktop + dark mode aware)
      const svgFavicon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <style>line{stroke:#0d0d0d}@media(prefers-color-scheme:dark){line{stroke:#ede9e2}}</style>
        ${svgLines}</svg>`;
      const iconLink = document.createElement('link');
      iconLink.rel = 'icon';
      iconLink.type = 'image/svg+xml';
      iconLink.href = 'data:image/svg+xml,' + encodeURIComponent(svgFavicon);
      document.head.appendChild(iconLink);

      // Apple touch icon — render SVG to 180×180 PNG canvas
      // viewBox cropped tight to actual drawing content (x:60-140, y:28-190) with small margin
      const svgForCanvas = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 18 96 180" fill="none" stroke="#0d0d0d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${svgLines}</svg>`;
      const img = new Image();
      const blob = new Blob([svgForCanvas], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      img.onload = function() {
        const size = 180;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f7f4ef';
        ctx.fillRect(0, 0, size, size);
        // fit the cropped viewBox (96×180) into the canvas with 10% padding
        const vbW = 96, vbH = 180, pad = 0.10;
        const scale = (size * (1 - pad * 2)) / Math.max(vbW, vbH);
        const w = vbW * scale, h = vbH * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        URL.revokeObjectURL(url);
        const touchLink = document.createElement('link');
        touchLink.rel = 'apple-touch-icon';
        touchLink.href = canvas.toDataURL('image/png');
        document.head.appendChild(touchLink);
      };
      img.src = url;

      // Apple touch startup image (PWA launch screen)
      const splashSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 18 96 180" fill="none" stroke="#0d0d0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${svgLines}</svg>`;
      const splashImg = new Image();
      const splashBlob = new Blob([splashSvg], { type: 'image/svg+xml' });
      const splashUrl = URL.createObjectURL(splashBlob);
      splashImg.onload = function() {
        const dpr = window.devicePixelRatio || 1;
        const sw = window.screen.width * dpr;
        const sh = window.screen.height * dpr;
        const canvas = document.createElement('canvas');
        canvas.width = sw; canvas.height = sh;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f7f4ef';
        ctx.fillRect(0, 0, sw, sh);
        // Draw chair centered at ~28% of screen height
        const chairH = sh * 0.18;
        const chairW = 96 * (chairH / 180);
        ctx.drawImage(splashImg, (sw - chairW) / 2, (sh - chairH) / 2, chairW, chairH);
        URL.revokeObjectURL(splashUrl);
        const splashLink = document.createElement('link');
        splashLink.rel = 'apple-touch-startup-image';
        splashLink.href = canvas.toDataURL('image/png');
        document.head.appendChild(splashLink);
      };
      splashImg.src = splashUrl;
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d0d;
      --paper: #f7f4ef;
      --border: #a8a49c;
    }

    [data-theme="dark"] {
      --ink: #ede9e2;
      --paper: #141412;
      --border: #363430;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 16px;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 56px 52px 44px;
      position: sticky;
      top: 0;
      background: var(--paper);
      z-index: 10;
      transition: padding 0.25s ease, max-height 0.3s ease, opacity 0.2s ease;
      border-bottom: none;
      max-height: 400px;
      overflow: hidden;
    }

    header.scrolled {
      padding: 18px 52px;
      border-bottom: 1px solid var(--border);
    }

    .header-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: clamp(22px, 2.8vw, 36px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: font-size 0.25s ease;
    }

    header.scrolled h1 {
      font-size: 19px;
    }

    .header-right {
      font-size: 17px;
      font-style: italic;
      opacity: 0.7;
      line-height: 1.5;
      margin-top: 10px;
      max-height: 60px;
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
    }

    header.scrolled .header-right {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    /* ── Hamburger ── */
    .hamburger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--ink);
      transition: opacity 0.15s;
    }

    .hamburger:hover span { opacity: 0.5; }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 260px;
      background: var(--paper);
      border-left: 1px solid var(--border);
      z-index: 50;
      padding: 52px 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }

    .sidebar.open { transform: translateX(0); }

    @media (max-width: 600px) {
      .sidebar {
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        border-left: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        gap: 0;
        padding: 32px 24px 28px;
        transform: translateY(-100%);
        align-items: flex-start;
      }
      .sidebar.open { transform: translateY(0); }
      .sidebar-section { flex: 1; }
      .sidebar-close { top: 16px; right: 16px; }
    }

    .sidebar-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      color: var(--ink);
      opacity: 0.5;
      line-height: 1;
      padding: 4px;
      transition: opacity 0.12s;
    }

    .sidebar-close:hover { opacity: 1; }

    .sidebar-section {}

    .sidebar-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-bottom: 16px;
      display: block;
    }

    .sidebar-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 17px;
      font-style: italic;
      cursor: pointer;
      color: var(--ink);
      opacity: 0.4;
      padding: 0;
      text-align: left;
      transition: opacity 0.12s;
    }

    .ctrl-btn:hover { opacity: 0.7; }

    .ctrl-btn.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .theme-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .theme-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: var(--ink);
      opacity: 0.35;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: inherit;
      font-size: 17px;
      font-style: italic;
      transition: opacity 0.12s;
    }

    .theme-btn:hover { opacity: 0.7; }

    .theme-btn.active {
      opacity: 1;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .theme-btn svg { flex-shrink: 0; }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
    }

    .sidebar-backdrop.open { display: block; }

    /* ── Grid status ── */
    .grid-status {
      padding: 12px 52px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-style: italic;
      opacity: 0.45;
      letter-spacing: 0.04em;
      display: flex;
      max-height: 60px;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease, border-color 0.2s ease;
      justify-content: space-between;
    }

    @media (max-width: 600px) { .grid-status { padding: 12px 24px; } }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 760px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 32px 28px 28px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      display: flex;
      flex-direction: column;
    }

    .card:nth-child(4n) { border-right: none; }
    @media (max-width: 1100px) { .card:nth-child(4n) { border-right: 1px solid var(--border); } .card:nth-child(3n) { border-right: none; } }
    @media (max-width: 760px)  { .card:nth-child(3n) { border-right: 1px solid var(--border); } .card:nth-child(2n) { border-right: none; } }
    @media (max-width: 480px)  { .card { border-right: none; } }

    .card:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .card-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0 20px;
      min-height: 140px;
    }

    .card-art svg {
      width: 100%;
      max-width: 140px;
      height: auto;
    }

    .card-name {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.03em;
      margin-bottom: 5px;
    }

    .card-meta {
      font-size: 16px;
      font-style: italic;
      opacity: 0.72;
      line-height: 1.5;
    }

    .card-meta span {
      display: block;
    }

    .movement-tag {
      display: inline-block;
      font-size: 10px;
      font-style: normal;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-top: 8px;
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,13,13,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      padding: 24px;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--paper);
      color: var(--ink);
      max-width: 820px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transform: translateY(12px);
      transition: transform 0.18s ease;
    }

    .overlay.open .modal {
      transform: translateY(0);
    }

    [data-theme="dark"] .modal { background: #46423d; color: var(--ink); }

    .modal-art {
      border-right: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 40px;
      min-height: 360px;
    }

    .modal-art svg {
      width: 100%;
      max-width: 200px;
      height: auto;
    }

    .modal-body {
      padding: 48px 40px 40px;
      display: flex;
      flex-direction: column;
    }


    .modal-name {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .modal-designer {
      display: block;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-style: italic;
      color: var(--ink);
      opacity: 0.6;
      margin-bottom: 28px;
      padding: 0;
      cursor: pointer;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity 0.12s;
    }

    .modal-designer:hover { opacity: 1; }

    .clear-designer {
      background: none;
      border: none;
      font-family: inherit;
      font-size: inherit;
      font-style: inherit;
      color: var(--ink);
      cursor: pointer;
      padding: 0 0 0 8px;
      font-size: 18px;
      line-height: 1;
      position: relative;
      top: 2px;
      opacity: 0.5;
      transition: opacity 0.12s;
    }

    .clear-designer:hover { opacity: 1; }

    .modal-desc {
      font-size: 16px;
      line-height: 1.75;
      opacity: 0.8;
      flex: 1;
    }

    .modal-details {
      margin-top: 32px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 12px 20px;
      align-items: baseline;
    }

    .detail-row { display: contents; }

    .detail-label {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 9.5px;
      opacity: 0.6;
      white-space: nowrap;
    }

    .detail-value {
      font-style: italic;
      opacity: 0.75;
      line-height: 1.4;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      color: var(--ink);
      opacity: 0.35;
      line-height: 1;
      padding: 4px;
      transition: opacity 0.12s;
    }

    .modal-close:hover { opacity: 1; }

    .modal-wrap {
      position: relative;
    }

    /* ── FULLSCREEN FEATURE ── */
    body.fs header {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      pointer-events: none;
      border: none;
    }

    body.fs #gridStatus {
      max-height: 0;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      border-color: transparent;
    }

    .fs-hint {
      position: fixed;
      bottom: 28px;
      right: 36px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    body.fs .fs-hint {
      opacity: 0.28;
      pointer-events: auto;
      cursor: pointer;
      mix-blend-mode: difference;
      color: white;
    }

    .scroll-top {
      position: fixed;
      bottom: 48px;
      right: 36px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      background: none;
      border: none;
      padding: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
    }

    .scroll-top.visible {
      opacity: 0.28;
      pointer-events: auto;
      mix-blend-mode: difference;
      color: white;
    }

    .scroll-top.visible:hover { opacity: 0.7; }

    .scroll-top-arrow { display: none; }

    @media (max-width: 600px) {
      .scroll-top-label { display: none; }
      .scroll-top-arrow { display: block; }
    }
    /* ── END FULLSCREEN FEATURE ── */

    /* ── TIMELINE FEATURE ── */
    .timeline {
      display: none;
      padding: 0 52px 80px;
    }

    .tl-inner {
      display: flex;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 40px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tl-inner::-webkit-scrollbar { display: none; }

    .tl-decade {
      flex-shrink: 0;
      min-width: 220px;
      padding-right: 48px;
    }

    .tl-decade + .tl-decade {
      border-left: 1px solid var(--border);
      padding-left: 48px;
    }

    .tl-decade-label {
      font-size: 20px;
      font-style: italic;
      font-weight: 500;
      opacity: 1;
      display: block;
      padding-top: 32px;
      margin-bottom: 24px;
    }

    .tl-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      padding: 16px 0;
      width: 100%;
      text-align: left;
      opacity: 1;
      transition: opacity 0.12s;
    }

    .tl-decade .tl-card:first-child { border-top: 1px solid var(--border); }
    .tl-card:last-child { border-bottom: none; }
    .tl-card:hover { opacity: 0.55; }

    .tl-art {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tl-art svg { width: 100%; height: 100%; }

    .tl-card-name {
      font-size: 17px;
      line-height: 1.2;
    }

    .tl-card-year {
      font-size: 13px;
      opacity: 0.45;
      margin-top: 4px;
    }
    /* ── END TIMELINE FEATURE ── */

    /* ── LIST FEATURE ── */
    .list-view {
      display: none;
      overflow-x: auto;
    }

    .list-inner {
      display: flex;
      min-height: 100%;
    }

    .list-col {
      flex-shrink: 0;
      width: 376px;
      padding: 28px 48px 0 0;
    }

    .list-col:first-child { padding-left: 52px; width: 380px; }
    .list-col:last-child  { padding-right: 52px; width: 380px; }
    .list-col + .list-col { border-left: 1px solid var(--border); padding-left: 48px; }

    .list-item {
      display: flex;
      align-items: baseline;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      padding: 6px 0;
      width: 100%;
      text-align: left;
      opacity: 0.75;
      transition: opacity 0.12s;
      gap: 12px;
    }

    .list-item:hover { opacity: 1; }
    .list-item-num  { font-size: 13px; opacity: 0.35; flex-shrink: 0; min-width: 26px; }
    .list-item-name { font-size: 17px; flex: 1; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(0,0,0,0.25); }
    [data-theme="dark"] .list-item-name { text-decoration-color: rgba(255,255,255,0.2); }
    .list-item:hover .list-item-name { text-decoration-color: currentColor; }
    .list-item-year { font-size: 13px; opacity: 0.35; flex-shrink: 0; }

    @media (max-width: 768px) {
      .list-view  { overflow-x: visible; align-items: flex-start; }
      .list-inner { flex-direction: column; width: 100%; }
      .list-col                { width: 100%; padding: 0 24px; border-left: none !important; }
      .list-col:first-child   { width: 100%; padding-left: 24px; padding-right: 24px; padding-top: 26px; }
      .list-col:last-child    { width: 100%; padding-left: 24px; padding-right: 24px; }
    }
    /* ── END LIST FEATURE ── */

    @media (max-width: 600px) {
      header { padding: 36px 24px 28px; }
      header.scrolled { padding: 36px 24px 28px; border-bottom: none; }
      header.scrolled h1 { font-size: clamp(22px, 2.8vw, 36px); }
      .header-right { display: none; }
      /* Full-screen modal */
      .overlay { padding: 0; align-items: flex-start; }
      .modal { grid-template-columns: 1fr; max-height: 100vh; min-height: 100vh; transform: none; }
      .overlay.open .modal { transform: none; }
      .modal-close { font-size: 22px; opacity: 0.5; top: 16px; right: 16px; }
      .modal-art { border-right: none; border-bottom: 1px solid var(--border); padding: 36px 24px; min-height: 220px; }
      .modal-body { padding: 32px 24px; }
      .card { padding: 24px 20px 20px; }
      /* TIMELINE mobile */
      .timeline { padding: 0 24px 60px; }
      .tl-inner { flex-direction: column; overflow-x: visible; padding-bottom: 0; }
      .tl-decade { min-width: 0; width: 100%; padding-right: 0; padding-bottom: 24px; }

// ── Render grid ──────────────────────────────────────
const grid           = document.getElementById('grid');
const timeline       = document.getElementById('timeline');
const listEl         = document.getElementById('listView');

const sorters = {
  name:     (a, b) => a.name.localeCompare(b.name),
  year:     (a, b) => parseInt(a.year) - parseInt(b.year),
  designer: (a, b) => a.designer.localeCompare(b.designer),
};

let currentSort        = 'name';
let currentDesigner    = null;
let currentMovement    = null;
let currentView        = 'grid';

const sortLabels = { name: 'A–Z', year: 'Year', designer: 'Designer' };

function renderGrid() {
  let visible = [...chairs];
  if (currentDesigner) visible = visible.filter(c => c.designer === currentDesigner);
  if (currentMovement) visible = visible.filter(c => c.movement === currentMovement);
  visible.sort(sorters[currentSort]);

  const statusLeft = currentDesigner
    ? `Chairs by ${currentDesigner}`
    : currentMovement
    ? currentMovement
    : sortLabels[currentSort];
  const clearBtn = (currentDesigner || currentMovement)
    ? `<button class="clear-designer" onclick="clearFilter()">×</button>`
    : '';
  document.getElementById('gridStatus').innerHTML =
    `<span>${statusLeft}</span><span>${visible.length} chairs${clearBtn}</span>`;

  grid.innerHTML = '';
  visible.forEach((chair) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-art">${chair.svg}</div>
      <h2 class="card-name">${chair.name}</h2>
      <div class="card-meta">
        <span>${chair.designer}</span>
        <span>${chair.year}</span>
      </div>`;
    card.addEventListener('click', () => openModal(chair));
    grid.appendChild(card);
  });
}

function clearFilter() {
  currentDesigner = null;
  currentMovement = null;
  renderView();
}

function filterByDesigner(name) {
  currentDesigner = name;
  currentMovement = null;
  closeModal();
  renderView();
}

function filterByMovement(name) {
  currentMovement = name;
  currentDesigner = null;
  closeModal();
  renderView();
}

// ── LIST FEATURE ──────────────────────────────────────
function getGroupKey(c) {
  if (currentSort === 'year')     return `${Math.floor(parseInt(c.year) / 10) * 10}s`;
  if (currentSort === 'designer') return c.designer;
  return c.name[0].toUpperCase();
}

function renderList() {
  let visible = [...chairs];
  if (currentDesigner) visible = visible.filter(c => c.designer === currentDesigner);
  if (currentMovement) visible = visible.filter(c => c.movement === currentMovement);
  visible.sort(sorters[currentSort]);

  const statusLeft = currentDesigner ? `Chairs by ${currentDesigner}`
    : currentMovement ? currentMovement : sortLabels[currentSort];
  const clearBtn = (currentDesigner || currentMovement)
    ? `<button class="clear-designer" onclick="clearFilter()">×</button>` : '';
  document.getElementById('gridStatus').innerHTML =
    `<span>${statusLeft}</span><span>${visible.length} chairs${clearBtn}</span>`;

  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    listEl.style.height = '';
    listEl.innerHTML = `<div class="list-inner"><div class="list-col">${
      visible.map((c, i) => `
        <button class="list-item" data-id="${c.id}">
          <span class="list-item-num">${String(i + 1).padStart(2, '0')}.</span>
          <span class="list-item-name">${c.name}</span>
          <span class="list-item-year">${c.year}</span>
        </button>`).join('')
    }</div></div>`;
  } else {
    // Measure available height synchronously, then build columns
    const listTop = listEl.getBoundingClientRect().top;
    const containerH = window.innerHeight - listTop;
    listEl.style.height = containerH + 'px';

    const itemH = 35; // 17px font + 6px*2 padding ≈ 35px
    const colPadTop = 28;
    const itemsPerCol = Math.max(1, Math.floor((containerH - colPadTop) / itemH));

    let cols = '';
    for (let i = 0; i < visible.length; i += itemsPerCol) {
      const slice = visible.slice(i, i + itemsPerCol);
      cols += `<div class="list-col">${
        slice.map((c, j) => `
          <button class="list-item" data-id="${c.id}">
            <span class="list-item-num">${String(i + j + 1).padStart(2, '0')}.</span>
            <span class="list-item-name">${c.name}</span>
            <span class="list-item-year">${c.year}</span>
          </button>`).join('')
      }</div>`;
    }
    listEl.innerHTML = `<div class="list-inner">${cols}</div>`;
  }

  listEl.querySelectorAll('.list-item').forEach(btn => {
    btn.addEventListener('click', () => openModal(chairs.find(c => c.id === btn.dataset.id)));
  });
}
// ── END LIST FEATURE ──────────────────────────────────

// ── TIMELINE FEATURE ──────────────────────────────────
function renderTimeline() {
  let visible = [...chairs];
  if (currentDesigner) visible = visible.filter(c => c.designer === currentDesigner);
  if (currentMovement) visible = visible.filter(c => c.movement === currentMovement);
  visible.sort((a, b) => parseInt(a.year) - parseInt(b.year));

  const statusLeft = currentDesigner ? `Chairs by ${currentDesigner}`
    : currentMovement ? currentMovement : 'Timeline';
  const clearBtn = (currentDesigner || currentMovement)
    ? `<button class="clear-designer" onclick="clearFilter()">×</button>` : '';
  document.getElementById('gridStatus').innerHTML =
    `<span>${statusLeft}</span><span>${visible.length} chairs${clearBtn}</span>`;

  const decades = {};
  visible.forEach(c => {
    const d = Math.floor(parseInt(c.year) / 10) * 10;
    (decades[d] = decades[d] || []).push(c);
  });

  timeline.innerHTML = `<div class="tl-inner">${
    Object.entries(decades).map(([decade, items]) => `
      <div class="tl-decade">
        <span class="tl-decade-label">${decade}s</span>
        ${items.map(c => `
          <button class="tl-card" data-id="${c.id}">
            <div class="tl-art">${c.svg}</div>
            <div>
              <div class="tl-card-name">${c.name}</div>
              <div class="tl-card-year">${c.year}</div>
            </div>
          </button>`).join('')}
      </div>`).join('')}
  </div>`;

  timeline.querySelectorAll('.tl-card').forEach(btn => {
    btn.addEventListener('click', () => openModal(chairs.find(c => c.id === btn.dataset.id)));
  });
}

function setView(view) {
  currentView = view;
  document.getElementById('viewGridBtn').classList.toggle('active', view === 'grid');
  document.getElementById('viewTimelineBtn').classList.toggle('active', view === 'timeline');
  document.getElementById('viewListBtn').classList.toggle('active', view === 'list');
  document.getElementById('sortSection').style.display = view === 'timeline' ? 'none' : '';
  document.getElementById('gridStatus').style.display = '';
  grid.style.display         = view === 'grid'     ? '' : 'none';
  timeline.style.display     = view === 'timeline' ? 'block' : 'none';
  listEl.style.display       = view === 'list'     ? 'flex'  : 'none';
  renderView();
}

function renderView() {
  if (currentView === 'grid') renderGrid();
  else if (currentView === 'timeline') renderTimeline();
  else renderList();
}
// ── END TIMELINE FEATURE ──────────────────────────────

renderView();

document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSort = btn.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderView();
  });
});

document.querySelectorAll('[data-era]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentEra = btn.dataset.era;
    document.querySelectorAll('[data-era]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });
});

// ── Sidebar ──────────────────────────────────────────
const sidebar  = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');

function openSidebar()  { sidebar.classList.add('open'); backdrop.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }

document.getElementById('hamburger').addEventListener('click', openSidebar);
document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
backdrop.addEventListener('click', closeSidebar);

// ── Modal ────────────────────────────────────────────
const overlay = document.getElementById('overlay');
const modal   = document.getElementById('modal');

function openModal(c) {
  modal.innerHTML = `
    <div class="modal-art">${c.svg}</div>
    <div class="modal-body">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&#x2715;</button>
      <h2 class="modal-name">${c.name}</h2>
      <button class="modal-designer" onclick="filterByDesigner('${c.designer}')">${c.designer}</button>
      <p class="modal-desc">${c.description}</p>
      <div class="modal-details">
        <div class="detail-row">
          <span class="detail-label">Year</span>
          <span class="detail-value">${c.year}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Origin</span>
          <span class="detail-value">${c.origin}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Manufacturer</span>
          <span class="detail-value">${c.manufacturer}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Movement</span>
          <span class="detail-value"><button class="modal-designer" style="margin-bottom:0" onclick="filterByMovement('${c.movement}')">${c.movement}</button></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Material</span>
          <span class="detail-value">${c.material}</span>
        </div>
      </div>
    </div>`;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

// ── Theme ─────────────────────────────────────────────
const themeLightBtn = document.getElementById('themeLightBtn');
const themeDarkBtn  = document.getElementById('themeDarkBtn');

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  themeLightBtn.classList.toggle('active', theme === 'light');
  themeDarkBtn.classList.toggle('active',  theme === 'dark');
}

(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { setTheme(saved); return; }
  const hour = new Date().getHours();
  setTheme(hour < 7 || hour >= 19 ? 'dark' : 'light');
})();
// ── End Theme ─────────────────────────────────────────

const headerEl = document.querySelector('header');
const scrollTopBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => {
  headerEl.classList.toggle('scrolled', window.scrollY > 10);
  scrollTopBtn.classList.toggle('visible', window.scrollY > window.innerHeight);
}, { passive: true });

overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── FULLSCREEN FEATURE ──────────────────────────────
function toggleFullscreen() {
  document.body.classList.toggle('fs');
  if (currentView === 'list') setTimeout(renderList, 320);
}

document.addEventListener('keydown', e => {
  if (e.key === 'f' && !e.metaKey && !e.ctrlKey && !overlay.classList.contains('open') && e.target.tagName !== 'INPUT') {
    toggleFullscreen();
  }
});
// ── END FULLSCREEN FEATURE ──────────────────────────
</script>
